// ---------- DETALHE ----------
function sizeChart(sz,ot,total){
 var ks=Object.keys(sz).sort(function(a,b){return SIZES.indexOf(a)-SIZES.indexOf(b)});if(!ks.length)return '<p class="note">Sem venda para mostrar grade.</p>';
 var mx=Math.max.apply(null,ks.map(function(k){return sz[k]}));
 return '<div class="sz">'+ks.map(function(k){return '<div><u>'+N(sz[k])+'</u><i style="height:'+(sz[k]/mx*88)+'%"></i><em>'+k+'</em></div>'}).join('')+'</div>'+(ot>0?'<p class="note">+ '+ot+' peças em outros tamanhos que o relatório não detalha (referência de grade estendida).</p>':'');}
function abrir(c){
 var r=R.filter(function(x){return x.c===c})[0];var rg=byRegion(r);
 var h=(IMG[r.c]?'<img src="'+IMG[r.c]+'" alt="'+r.c+'" style="width:100%;max-height:430px;object-fit:contain;background:var(--pn2);border-radius:10px;margin-bottom:12px">':'')+'<h2 style="margin:0 28px 2px 0;font-size:25px">'+r.c+' · '+esc(r.d)+'</h2><div class="sub" style="margin-bottom:10px">'+esc(r.tp)+' · '+esc(r.m)+(r.tc?' · '+esc(r.tc):'')+(r.cp?' · '+esc(r.cp):'')+'</div>'+
 '<div style="margin-bottom:12px">'+tag(r.k)+tecsOf(r,true).map(function(t){return '<span class="mini">'+esc(t)+'</span>'}).join('')+'</div>'+
 '<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><b>'+N(r.t)+'</b><span>peças'+(r.rk?' · '+r.rk+'ª de '+R.filter(function(x){return x.t>0}).length:'')+'</span></div><div class="kpi"><b>'+BRL(r.val)+'</b><span>a preço de tabela (R$ '+N(r.p)+')</span></div>'+
 '<div class="kpi"><b>'+r.nr+'</b><span>representantes venderam</span></div><div class="kpi"><b>'+(r.d5?'+'+N(r.d5):'0')+'</b><span>peças desde 18/11</span></div></div>';
 h+='<h3 style="margin:14px 0 0;font-size:18px">Grade vendida por tamanho</h3><div class="note" style="margin-top:0">Total da coleção (o Sisplan não abre a grade por representante)'+(r.g?' · grade da ref.: '+r.g:'')+'</div>'+sizeChart(r.sz,r.ot,r.t);
 var rgk=REG.slice().sort(function(x,y){return (rg[y]||0)-(rg[x]||0)});
 h+='<h3 style="margin:16px 0 4px;font-size:18px">Por região</h3>'+rgk.map(function(g){var v=rg[g]||0;return '<div class="row2"'+(v?'':' style="color:var(--mu)"')+'><span style="width:120px">'+g+'</span><span style="flex:1">'+bar(v,r.t||1)+'</span><b>'+N(v)+'</b></div>'}).join('');
 var rk=Object.keys(RP).sort(function(a,b){return ((r.br[b]||0)-(r.br[a]||0))||(RP[a].n<RP[b].n?-1:1)});
 h+='<h3 style="margin:16px 0 4px;font-size:18px">Por representante</h3>'+rk.map(function(k){var v=r.br[k]||0;return '<div class="row2"'+(v?'':' style="color:var(--mu)"')+'><span style="width:170px">'+esc(RP[k].n)+'<span class="mini">'+RP[k].uf+'</span></span><span style="flex:1">'+bar(v,r.t||1)+'</span><b>'+N(v)+'</b></div>'}).join('');
 document.getElementById('drc').innerHTML=h;document.getElementById('dr').classList.add('on');}
function fechar(){document.getElementById('dr').classList.remove('on');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')fechar();});

// ---------- REGIÕES ----------
function vReg(){
 var tipos=uniq(function(r){return r.tp});var m={};REG.forEach(function(g){m[g]={};});
 var tg={};REG.forEach(function(g){tg[g]=0});
 R.forEach(function(r){var rg=byRegion(r);for(var g in rg){if(!m[g])continue;m[g][r.tp]=(m[g][r.tp]||0)+rg[g];tg[g]+=rg[g];}});
 var h='<div class="kpis">'+REG.map(function(g){var n=Object.keys(REPT).filter(function(k){return regOf(k)===g}).length,t=Object.keys(REPT).filter(function(k){return regOf(k)===g}).length;return '<div class="kpi" style="cursor:pointer;'+(S.regSel===g?'border-color:var(--ac)':'')+'" onclick="S.regSel=\''+g+'\';render()"><b>'+N(tg[g])+'</b><span>'+g+' · '+P(tg[g]/TOTAL,0)+' das peças · '+n+' reps</span></div>'}).join('')+'</div>';
 var g=S.regSel;var rows=R.map(function(r){return {r:r,q:(byRegion(r)[g]||0)}}).filter(function(x){return x.q>0}).sort(function(a,b){return b.q-a.q});
 var mxg=rows.length?rows[0].q:1;
 h+='<div class="card"><h2>'+g+': referências mais vendidas</h2><p class="d">Participação = quanto da venda total da referência veio desta região. Região mais forte que a média da coleção aparece em negrito azul.</p><table><tr><th>#</th><th>Ref.</th><th>Descrição</th><th class="n">Peças</th><th></th><th class="n">% da ref. vem daqui</th><th class="n">% da região</th></tr>'+
 rows.slice(0,25).map(function(x,i){var sh=x.q/x.r.t,base=tg[g]/TOTAL;return '<tr class="cl" onclick="abrir(\''+x.r.c+'\')"><td class="n">'+(i+1)+'</td><td><b>'+x.r.c+'</b></td><td>'+esc(x.r.d)+'<span class="mini">'+esc(x.r.m)+'</span></td><td class="n"><b>'+N(x.q)+'</b></td><td style="width:14%">'+bar(x.q,mxg)+'</td><td class="n '+(sh>base*1.4?'pos':'')+'">'+P(sh,0)+'</td><td class="n">'+P(x.q/tg[g])+'</td></tr>'}).join('')+'</table></div>';
 h+='<div class="card"><h2>Tipo de peça por região</h2><p class="d">Peças vendidas. Cor mais forte = maior parcela da região naquele tipo.</p><table class="hm"><tr><th>Tipo</th>'+REG.map(function(x){return '<th class="n">'+x+'</th>'}).join('')+'</tr>'+
 tipos.map(function(t){return '<tr><td>'+t+'</td>'+REG.map(function(x){var v=m[x][t]||0,s=tg[x]?v/tg[x]:0;return '<td class="v" style="background:rgba(195,214,238,'+Math.min(1,s*3)+')">'+(v?N(v)+'<br><small style="color:var(--mu)">'+P(s,0)+'</small>':'–')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
 return h;}

// ---------- REPRESENTANTES ----------
function vRep(){
 var ks=Object.keys(RP).map(function(k){return {k:k,t:REPT[k]||0}}).sort(function(a,b){return b.t-a.t});
 var mx=ks[0].t||1;
 var h='<div class="grid2"><div class="card"><h2>Representantes</h2><p class="d">Clique para ver as referências que cada um vende.</p><table><tr><th>Representante</th><th>Região</th><th class="n">Peças</th><th></th><th class="n">Refs vendidas</th></tr>'+
 ks.map(function(x){var n=0;R.forEach(function(r){if(r.br[x.k]>0)n++});return '<tr class="cl" onclick="S.repSel=\''+x.k+'\';render()" style="'+(S.repSel===x.k?'background:var(--pn2)':'')+(x.t?'':'color:var(--mu)')+'"><td>'+esc(RP[x.k].n)+'<span class="mini">'+RP[x.k].uf+'</span></td><td>'+RP[x.k].reg+'</td><td class="n"><b>'+N(x.t)+'</b></td><td style="width:16%">'+bar(x.t,mx)+'</td><td class="n">'+(n||'–')+'</td></tr>'}).join('')+'</table></div>';
 var k=S.repSel||ks[0].k;
 var rows=R.filter(function(r){return r.br[k]>0}).sort(function(a,b){return b.br[k]-a.br[k]});
 var tp={};rows.forEach(function(r){tp[r.tp]=(tp[r.tp]||0)+r.br[k]});var tt=REPT[k]||0;
 h+='<div><div class="card"><h2>'+esc(RP[k].n)+' · '+RP[k].r+'</h2><p class="d">'+N(tt)+' peças · '+rows.length+' referências · '+P(tt/TOTAL)+' da coleção</p>'+
 Object.keys(tp).sort(function(a,b){return tp[b]-tp[a]}).map(function(t){return '<div class="row2"><span style="width:130px">'+t+'</span><span style="flex:1">'+bar(tp[t],tt)+'</span><b>'+N(tp[t])+'</b><span style="width:46px;text-align:right;color:var(--mu)">'+P(tp[t]/tt,0)+'</span></div>'}).join('')+'</div>'+
 '<div class="card"><h2>Referências de '+esc(RP[k].n)+'</h2><table><tr><th>Ref.</th><th>Descrição</th><th class="n">Peças</th><th class="n">% da ref.</th></tr>'+rows.slice(0,30).map(function(r){return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td><b>'+r.c+'</b></td><td>'+esc(r.d)+'<span class="mini">'+esc(r.m)+'</span></td><td class="n"><b>'+N(r.br[k])+'</b></td><td class="n">'+P(r.br[k]/r.t,0)+'</td></tr>'}).join('')+'</table>'+(rows.length>30?'<p class="note">Mostrando as 30 maiores de '+rows.length+'.</p>':'')+'</div></div></div>';
 return h;}

// ---------- PRODUÇÃO ----------
function vProd(){
 var apostar=R.filter(function(r){return r.k==='A'&&r.nr>=4&&!(r.t>=30&&r.top>=.4)});
 var conc=R.filter(function(r){return r.k==='A'&&(r.nr<4||(r.t>=30&&r.top>=.4))});
 var calma=R.filter(function(r){return r.k==='C'}).sort(function(a,b){return a.t-b.t});
 var sem=R.filter(function(r){return r.k==='Z'});
 var lista=function(a,max){return '<table><tr><th>Ref.</th><th>Descrição</th><th class="n">Peças</th><th class="n">Reps</th><th class="n">Maior rep.</th></tr>'+a.slice(0,max).map(function(r){return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td><b>'+r.c+'</b></td><td>'+esc(r.d)+'<span class="mini">'+esc(r.m)+'</span></td><td class="n"><b>'+N(r.t)+'</b></td><td class="n">'+r.nr+'</td><td class="n">'+(r.t?P(r.top,0):'–')+'</td></tr>'}).join('')+'</table>'+(a.length>max?'<p class="note">Mostrando '+max+' de '+a.length+'. Veja todas em "Todas as referências" filtrando pela classe.</p>':'');};
 var h='<div class="card"><h2>Como ler</h2><p class="d" style="margin:0">Vendas são pedidos já tirados pelos representantes (não é estoque nem produção). A coleção ainda está aberta, então o ranking pode mudar: use como direção, não como sentença. Classe vem da curva ABC; "Apostar" exige venda em 4+ representantes e nenhum com 40% ou mais da referência.</p></div>';
 h+='<div class="grid2"><div class="card"><h2 style="color:var(--tx)">Apostar: lotes maiores</h2><p class="d">'+apostar.length+' referências classe A com demanda espalhada pela rede.</p>'+lista(apostar,20)+'</div>'+
 '<div class="card"><h2 style="color:var(--ac)">Classe A, mas concentrada</h2><p class="d">'+conc.length+' referências fortes, porém dependem de poucos representantes. Confirmar com a rede antes de aumentar lote.</p>'+lista(conc,20)+'</div></div>';
 h+='<div class="grid2"><div class="card"><h2 style="color:var(--wn)">Produzir com calma</h2><p class="d">'+calma.length+' referências classe C (venda baixa): risco de sobra se o lote for grande.</p>'+lista(calma,20)+'</div>'+
 '<div class="card"><h2 style="color:var(--mu)">Sem venda</h2><p class="d">'+sem.length+' referências sem pedido.</p>'+lista(sem,20)+'</div></div>';
 var tp=uniq(function(r){return r.tp}),allS=['30','32','34','36','38','40','42','44','46','48','50','52','54','PP','P','M','G','GG'];
 var cur={};R.forEach(function(r){var o=cur[r.tp]||(cur[r.tp]={t:0,s:{}});for(var k in r.sz){o.s[k]=(o.s[k]||0)+r.sz[k];o.t+=r.sz[k];}});
 var usados=allS.filter(function(k){return tp.some(function(t){return cur[t]&&cur[t].s[k]})});
 h+='<div class="card"><h2>Peças vendidas por tamanho, por tipo</h2><p class="d">Base para a grade de corte. Quantidade por numeração, somando os tamanhos que o relatório detalha. Quanto mais dourado, maior a parcela daquele tamanho dentro do tipo.</p><table class="hm"><tr><th>Tipo</th>'+usados.map(function(k){return '<th class="n">'+k+'</th>'}).join('')+'<th class="n">Peças</th></tr>'+
 tp.filter(function(t){return cur[t]}).map(function(t){var o=cur[t],mx=Math.max.apply(null,usados.map(function(k){return (o.s[k]||0)/o.t}));return '<tr><td>'+t+'</td>'+usados.map(function(k){var s=(o.s[k]||0)/o.t;return '<td class="v" style="background:rgba(195,214,238,'+(s/mx)+')">'+((o.s[k]||0)?N(o.s[k]):'–')+'</td>'}).join('')+'<td class="n">'+N(o.t)+'</td></tr>'}).join('')+'</table></div>';
 return h;}


// ---------- APOSTAS DE DEZEMBRO ----------
function vDez(){
 var ap=R.filter(function(r){return r.dz}),fora=R.filter(function(r){return !r.dz});
 var pc=ap.reduce(function(a,r){return a+r.t},0),pd=ap.reduce(function(a,r){return a+r.dv},0);
 var comD=ap.filter(function(r){return r.dv>0}).length,cA=ap.filter(function(r){return r.k==='A'}).length;
 var tpOf={};ap.forEach(function(r){tpOf[r.dz]=r.tp});
 var h='<div class="card"><h2>Apostas de dezembro: acertamos na seleção?</h2><p class="d" style="margin:0">'+ap.length+' referências escolhidas para vender primeiro. O foco é a <b>venda com entrega em dezembro</b>; a venda total da coleção aparece ao lado como referência. Referências fora da lista de apostas foram desconsideradas no arquivo de dezembro.</p></div>';
 h+='<div class="kpis"><div class="kpi"><b>'+N(pd)+'</b><span>peças vendidas com entrega em dezembro</span></div>'+
 '<div class="kpi"><b>'+comD+' <small style="font-size:20px;color:var(--mu)">de '+ap.length+'</small></b><span>apostas com venda para dezembro</span></div>'+
 '<div class="kpi"><b>'+N(pd/ap.length)+'</b><span>média de peças por aposta em dezembro</span></div>'+
 '<div class="kpi"><b>'+P(pd/pc,0)+'</b><span>do vendido nas apostas ('+N(pc)+' peças no total) é para dezembro</span></div>'+
 '<div class="kpi"><b>'+cA+' <small style="font-size:20px;color:var(--mu)">de '+ap.length+'</small></b><span>apostas na classe A da coleção</span></div></div>';
 var rows=Object.keys(DEZ).map(function(g){var a=ap.filter(function(r){return r.dz===g}),o=fora.filter(function(r){return r.tp===tpOf[g]});
  var pa=a.reduce(function(x,r){return x+r.t},0),pdg=a.reduce(function(x,r){return x+r.dv},0),po=o.reduce(function(x,r){return x+r.t},0);
  return {g:g,n:a.length,vd:a.filter(function(r){return r.dv>0}).length,pd:pdg,p:pa,m:pa/a.length,no:o.length,mo:o.length?po/o.length:null,A:a.filter(function(r){return r.k==='A'}).length};});
 h+='<div class="card"><h2>Por grupo</h2><p class="d">Entrega de dezembro e venda total das apostas. A razão compara a venda total média de cada aposta com a das demais referências do mesmo tipo (1,00 = igual).</p><table><tr><th>Grupo</th><th class="n">Apostas</th><th class="n">Entrega dez.</th><th class="n">Média dez. por aposta</th><th class="n">Venda total</th><th class="n">% dez. do total</th><th class="n">Média das demais (total)</th><th class="n">Razão</th></tr>'+
 rows.map(function(x){var rz=x.mo?x.m/x.mo:null;return '<tr><td>'+esc(x.g)+'</td><td class="n">'+x.n+'</td><td class="n"><b>'+N(x.pd)+'</b></td><td class="n"><b>'+N(x.pd/x.n)+'</b></td><td class="n">'+N(x.p)+'</td><td class="n">'+P(x.pd/x.p,0)+'</td><td class="n">'+(x.mo!==null?N(x.mo):'–')+'</td><td class="n '+(rz===null?'':rz>=1?'pos':'neg')+'">'+(rz===null?'–':rz.toFixed(2).replace('.',',')+'x')+'</td></tr>';}).join('')+'</table>'+
 '<p class="note">Bermuda Feminina tem uma única referência no catálogo, por isso não há base de comparação.</p></div>';
 var mx=Math.max.apply(null,ap.map(function(r){return r.dv}))||1;
 var lista=function(a,dz){return '<table><tr><th class="n">#</th><th>Ref.</th><th>Descrição</th><th>Grupo</th>'+(dz?'<th class="n">Entrega dez.</th><th></th>':'')+'<th class="n">Venda total</th>'+(dz?'<th class="n">% dez.</th>':'')+'<th class="n">Reps</th><th>Classe</th></tr>'+a.map(function(r){return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td class="n">'+(r.rk||'–')+'</td><td><b>'+r.c+'</b></td><td>'+esc(r.d)+'<span class="mini">'+esc(r.m)+'</span></td><td>'+esc(r.dz||r.tp)+'</td>'+(dz?'<td class="n"><b>'+N(r.dv)+'</b></td><td style="width:11%">'+bar(r.dv,mx)+'</td>':'')+'<td class="n">'+(dz?N(r.t):'<b>'+N(r.t)+'</b>')+'</td>'+(dz?'<td class="n">'+(r.t?P(r.dv/r.t,0):'–')+'</td>':'')+'<td class="n">'+r.nr+'</td><td>'+tag(r.k)+'</td></tr>';}).join('')+'</table>';};
 h+='<div class="card"><h2>As '+ap.length+' apostas, da mais para a menos vendida em dezembro</h2><p class="d">A coluna # é a posição da referência na venda total da coleção ('+R.filter(function(r){return r.t>0}).length+' referências com venda).</p>'+lista(ap.slice().sort(function(a,b){return b.dv-a.dv||b.t-a.t||(a.c<b.c?-1:1)}),true)+'</div>';
 var rg={},rp={};ap.forEach(function(r){var o=DEZV[r.c]||{};for(var k in o){var g=regOf(k);rg[g]=(rg[g]||0)+o[k];rp[k]=(rp[k]||0)+o[k];}});
 var mr=Math.max.apply(null,REG.map(function(g){return rg[g]||0}))||1,mp=Math.max.apply(null,Object.keys(RP).map(function(k){return rp[k]||0}))||1;
 h+='<div class="grid2"><div class="card"><h2>Entrega de dezembro por região</h2>'+REG.slice().sort(function(a,b){return (rg[b]||0)-(rg[a]||0)}).map(function(g){var v=rg[g]||0;return '<div class="row2"'+(v?'':' style="color:var(--mu)"')+'><span style="width:120px">'+g+'</span><span>'+bar(v,mr)+'</span><b>'+N(v)+'</b></div>'}).join('')+'</div>'+
 '<div class="card"><h2>Entrega de dezembro por representante</h2>'+Object.keys(RP).sort(function(a,b){return ((rp[b]||0)-(rp[a]||0))||(RP[a].n<RP[b].n?-1:1)}).map(function(k){var v=rp[k]||0;return '<div class="row2"'+(v?'':' style="color:var(--mu)"')+'><span style="width:170px">'+esc(RP[k].n)+'<span class="mini">'+RP[k].uf+'</span></span><span>'+bar(v,mp)+'</span><b>'+N(v)+'</b></div>'}).join('')+'</div></div>';
 var sel=Object.keys(DEZ).filter(function(g){return fora.some(function(r){return r.tp===tpOf[g]})});
 var tops=fora.filter(function(r){return r.k==='A'&&sel.some(function(g){return tpOf[g]===r.tp})}).slice(0,10);
 h+='<div class="card"><h2>Mais vendidas que ficaram de fora da aposta</h2><p class="d">As 10 referências classe A, dos mesmos tipos, que não estavam na lista de dezembro (venda total da coleção). Podem indicar o que faltou apostar.</p>'+lista(tops,false)+'</div>';
 return h;}

// ---------- ESTILO ----------
function vEstilo(){
 var h='<div class="card"><h2>As apostas estão funcionando?</h2><p class="d">Cada tabela compara o rendimento médio por referência (peças por ref. lançada). Grupos com poucas referências têm leitura frágil: confira a coluna Refs.</p></div>';
 var sec=function(t,d,keyFn,min){return '<div class="card"><h2>'+t+'</h2><p class="d">'+d+'</p>'+tblGrupo(grupo(keyFn),'Grupo',min)+'</div>';};
 h+=sec('Por modelagem','Modelos com 3 ou mais referências.',function(r){return r.tp+' · '+r.m},3);
 h+=sec('Por tecnologia','Uma referência pode ter mais de uma tecnologia.',function(r){return r.tec.length?r.tec.filter(function(x){return x!=='Pack'}):null},1);
 h+=sec('Por tecido','Tecidos com 2 ou mais referências.',function(r){return r.tc},2);
 h+=sec('Por faixa de preço','Preço de tabela, sem as referências Pack. O grupo Pack aparece à parte.',function(r){if(r.pk)return 'Pack';return r.p<110?'Até R$ 109':r.p<130?'R$ 110 a 129':r.p<150?'R$ 130 a 149':r.p<170?'R$ 150 a 169':'R$ 170 ou mais'},1);
 return h;}

document.getElementById('topinfo').textContent=N(TOTAL)+' peças · '+R.length+' referências';
render();
</script>
</body>
