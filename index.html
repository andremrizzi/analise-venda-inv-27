:root{--bg:#FFFFFF;--pn:#FFFFFF;--pn2:#F1E8DE;--bd:#E4D8C7;--tx:#263349;--mu:#66748a;--ac:#40546F;--lb:#C3D6EE;--pe:#E2B7A6;--wn:#B0563F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,Arial,sans-serif;font-size:16px;line-height:1.35}
header{padding:20px 28px 12px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:30px;font-weight:600;color:var(--tx)}
.brand{font-size:12.5px;letter-spacing:.32em;color:var(--mu);margin-bottom:6px;font-weight:500}
.sub{color:var(--mu);font-size:15px}
nav{display:flex;gap:6px;padding:0 28px;border-bottom:1px solid var(--bd);flex-wrap:wrap}

nav button.on{color:var(--tx);border-color:var(--pe)}
main{padding:20px 28px 60px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--pn2);border-radius:10px;padding:14px 16px;border:1px solid transparent}
.kpi b{display:block;font-size:34px;font-weight:600;line-height:1.1}
.kpi span{color:var(--mu);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:16px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:21px;font-weight:600}
.card p.d{margin:0 0 10px;color:var(--mu);font-size:14.5px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{color:var(--mu);font-weight:500;font-size:13.5px;position:sticky;top:0;background:var(--pn);cursor:pointer;white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--pn2)}
.bar{height:9px;background:var(--pn2);border-radius:5px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap}
.tA{background:var(--tx);color:#fff}.tB{background:var(--lb);color:var(--tx)}.tC{background:var(--pe);color:var(--tx)}.tZ{background:var(--bd);color:var(--mu)}
.mini{display:inline-block;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:8px;padding:0 6px;margin-left:4px}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,input{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px}
input[type=search]{min-width:220px}
.chip{background:var(--pn2);border:1px solid var(--bd);border-radius:16px;padding:6px 14px;cursor:pointer;color:var(--mu);font:inherit;font-size:14.5px}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.sz{display:flex;align-items:flex-end;gap:6px;height:130px;margin:6px 0 2px}
.sz div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.sz i{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.sz em{font-style:normal;font-size:12.5px;color:var(--mu)}
.sz u{text-decoration:none;font-size:12.5px;margin-bottom:2px}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--pn);border-left:1px solid var(--bd);padding:20px 22px;overflow:auto;transform:translateX(105%);transition:transform .2s;z-index:10;box-shadow:-12px 0 30px #26334933}
#dr.on{transform:none}
#dr .x{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--mu);font-size:28px;cursor:pointer}
.row2{display:flex;align-items:center;gap:10px;font-size:15px;padding:3px 0}.row2>span:first-child{flex:none}.row2>span:nth-child(2){flex:1}.row2 b{flex:none;min-width:40px;text-align:right}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mu);margin:2px 0 12px}
.hm td.v{text-align:center;font-variant-numeric:tabular-nums;font-size:14.5px}
.note{color:var(--mu);font-size:14px;margin-top:10px}
.pos{color:var(--ac);font-weight:600}.neg{color:var(--wn)}
@media(max-width:700px){main,header,nav{padding-left:12px;padding-right:12px}.grid2{grid-template-columns:1fr}}
@media print{.kpi{border:1px solid var(--bd)}#dr{display:none}}
</style>

 '<div class="kpi"><b>'+N(TOTAL)+'</b><span>peças vendidas</span></div>'+
 '<div class="kpi"><b>'+vend.length+' <small style="font-size:20px;color:var(--mu)">de '+R.length+'</small></b><span>referências com venda</span></div>'+
 '<div class="kpi"><b class="'+(sem.length?'neg':'')+'">'+sem.length+'</b><span>referências sem nenhuma venda</span></div>'+
 '<div class="kpi"><b>'+P(top10/TOTAL,0)+'</b><span>das peças estão nas 10 mais vendidas</span></div>'+
 '<div class="kpi"><b>'+Object.keys(REPT).length+'</b><span>representantes com venda</span></div></div>';
 h+='<div class="card"><h2>Curva ABC das referências</h2><p class="d">Classe A = as referências que, somadas, formam os primeiros 70% das peças vendidas; B = próximos 20%; C = últimos 10%.</p>'+
 '<table><tr><th>Classe</th><th class="n">Referências</th><th class="n">Peças</th><th class="n">% das peças</th><th class="n">Média por ref.</th><th>Leitura para produção</th></tr>'+
 [['A',cA,'Giram mais: candidatas a lote maior'],['B',cB,'Ritmo mediano: manter plano'],['C',cC,'Giram pouco: produzir com calma'],['Z',sem,'Nenhuma venda: não produzir mais até reagir']].map(function(x){var p=s(x[1]);return '<tr><td>'+tag(x[0])+'</td><td class="n">'+x[1].length+'</td><td class="n">'+N(p)+'</td><td class="n">'+P(p/TOTAL)+'</td><td class="n">'+N(x[1].length?p/x[1].length:0)+'</td><td>'+x[2]+'</td></tr>';}).join('')+'</table></div>';
 h+='<div class="grid2"><div class="card"><h2>10 mais vendidas</h2><p class="d">Clique para ver grade por tamanho, regiões e representantes.</p>'+miniList(vend.slice(0,10),true)+'</div>';
 var low=vend.slice().sort(function(a,b){return a.t-b.t||(a.c<b.c?-1:1)}).slice(0,10);
 h+='<div class="card"><h2>10 menos vendidas (com venda)</h2><p class="d">Pedidos até agora; os lançamentos recentes podem ainda não ter chegado ao mercado.</p>'+miniList(low,true)+'</div></div>';
 h+='<div class="card"><h2>Por tipo de peça</h2><p class="d">Média por referência mostra qual categoria rende mais por item lançado. "Sem venda" em vermelho quando ≥ 30% das refs do grupo.</p>'+tblGrupo(grupo(function(r){return r.tp}),'Tipo')+'</div>';
 if(sem.length)h+='<div class="card"><h2>Referências sem venda ('+sem.length+')</h2>'+miniList(sem,false)+'</div>';
 return h;}
function miniList(a,showQ){return '<table>'+a.map(function(r){return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td><b>'+r.c+'</b></td><td>'+esc(r.d)+'<span class="mini">'+esc(r.m)+'</span></td>'+(showQ?'<td class="n"><b>'+N(r.t)+'</b></td>':'<td class="n">'+r.tp+'</td>')+'<td>'+tag(r.k)+'</td></tr>';}).join('')+'</table>';}

// ---------- REFERÊNCIAS ----------
function filtradas(){
 return R.filter(function(r){
  if(S.tipo&&r.tp!==S.tipo)return false;if(S.mod&&r.m!==S.mod)return false;
  if(S.tec&&(r.tec.indexOf(S.tec)<0&&!(S.tec==='Grade Estendida'&&r.ex)&&!(S.tec==='Importado'&&r.im)&&!(S.tec==='Pack'&&r.pk)))return false;
  if(S.cls&&r.k!==S.cls)return false;
  if(S.q&&(r.c+' '+r.d+' '+r.tc+' '+r.m).toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
  return true;});}
function vRefs(){
 var tecs=['Infinity Flex','Efeito Lipo','Não Desbota','Triple Dry','Térmica','Resinado','Moletom','Pack','Grade Estendida','Importado'];
 var h='<div class="flt"><input type="search" id="fq" placeholder="Buscar ref., modelo, tecido" value="'+esc(S.q)+'">'+
 '<select id="ftipo">'+opt(uniq(function(r){return r.tp}),S.tipo,'Todos os tipos')+'</select>'+
 '<select id="fmod">'+opt(uniq(function(r){return r.tp===S.tipo||!S.tipo?r.m:''}),S.mod,'Todas as modelagens')+'</select>'+
 '<select id="ftec">'+opt(tecs,S.tec,'Toda tecnologia')+'</select>'+
 '<select id="freg">'+opt(REG,S.reg,'Todas as regiões')+'</select>'+
 '<select id="frep"><option value="">Todos os representantes</option>'+Object.keys(REPT).sort(function(a,b){return RP[a].n<RP[b].n?-1:1}).map(function(k){return '<option value="'+k+'"'+(k===S.rep?' selected':'')+'>'+esc(RP[k].n)+'</option>'}).join('')+'</select>'+
 ['','A','B','C','Z'].map(function(k){return '<button class="chip'+(S.cls===k?' on':'')+'" onclick="S.cls=\''+k+'\';render()">'+(k?CL[k][0]:'Todas as classes')+'</button>'}).join('')+'</div>';
 var rows=filtradas().map(function(r){r.q=qf(r);return r;});
 var key=S.sort;rows.sort(function(a,b){var x=key==='t'?a.q:a[key],y=key==='t'?b.q:b[key];if(typeof x==='string')return S.dir*(x<y?-1:x>y?1:0);return S.dir*((x-y)||0)||(a.c<b.c?-1:1);});
 var mx=Math.max.apply(null,rows.map(function(r){return r.q}).concat([1])),tot=rows.reduce(function(a,r){return a+r.q},0);
 h+='<div class="lg"><span><b style="color:var(--tx)">'+rows.length+'</b> referências · <b style="color:var(--tx)">'+N(tot)+'</b> peças'+((S.reg||S.rep)?' (no filtro de região/representante)':'')+'</span><span>Classe ABC é sempre sobre o total da coleção · clique no cabeçalho para ordenar · clique na linha para detalhar</span></div>';
 var th=function(k,l,n){return '<th class="'+(n?'n':'')+'" data-k="'+k+'">'+l+(S.sort===k?(S.dir<0?' ▼':' ▲'):'')+'</th>'};
 h+='<div class="card" style="padding:6px 10px"><table id="tr"><tr>'+th('rk','#',1)+th('c','Ref.')+th('d','Descrição')+th('m','Modelagem')+th('t','Peças',1)+'<th></th>'+th('nr','Reps',1)+th('top','Maior rep.',1)+th('d5','Desde 18/11',1)+th('p','Preço',1)+th('k','Classe')+'</tr>'+
 rows.map(function(r){var ex=tecsOf(r).map(function(t){return '<span class="mini">'+t+'</span>'}).join('');
  return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td class="n">'+(r.rk||'–')+'</td><td><b>'+r.c+'</b></td><td>'+esc(r.d)+ex+'</td><td>'+esc(r.m)+'</td><td class="n"><b>'+N(r.q)+'</b></td><td style="width:11%">'+bar(r.q,mx)+'</td><td class="n">'+r.nr+'</td><td class="n '+(r.t>=30&&r.top>=.4?'neg':'')+'">'+(r.t?P(r.top,0):'–')+'</td><td class="n">'+(r.d5?'+'+N(r.d5):'–')+'</td><td class="n">'+N(r.p)+'</td><td>'+tag(r.k)+'</td></tr>';}).join('')+'</table></div>'+
 '<p class="note">"Maior rep." = parcela das peças que vem de um único representante; em vermelho (≥ 40%, com 30+ peças) indica demanda concentrada, ainda não confirmada pelo restante da rede.</p>';
 return h;}
function bindRefs(){
 var q=document.getElementById('fq');q.oninput=function(){S.q=q.value;var p=q.selectionStart;render();var n=document.getElementById('fq');n.focus();n.setSelectionRange(p,p);};
 [['ftipo','tipo'],['fmod','mod'],['ftec','tec'],['freg','reg'],['frep','rep']].forEach(function(x){document.getElementById(x[0]).onchange=function(){S[x[1]]=this.value;if(x[1]==='tipo')S.mod='';render();};});
 document.querySelectorAll('#tr th').forEach(function(t){t.onclick=function(){var k=t.getAttribute('data-k');if(!k)return;if(S.sort===k)S.dir=-S.dir;else{S.sort=k;S.dir=(k==='c'||k==='d'||k==='m'||k==='k')?1:-1;}render();};});}

// ---------- DETALHE ----------
function sizeChart(sz,ot,total){
 var ks=Object.keys(sz).sort(function(a,b){return SIZES.indexOf(a)-SIZES.indexOf(b)});if(!ks.length)return '<p class="note">Sem venda para mostrar grade.</p>';
 var mx=Math.max.apply(null,ks.map(function(k){return sz[k]}));
 return '<div class="sz">'+ks.map(function(k){return '<div><u>'+N(sz[k])+'</u><i style="height:'+(sz[k]/mx*88)+'%"></i><em>'+k+'</em></div>'}).join('')+'</div>'+(ot>0?'<p class="note">+ '+ot+' peças em outros tamanhos que o relatório não detalha (referência de grade estendida).</p>':'');}
function abrir(c){
 var r=R.filter(function(x){return x.c===c})[0];var rg=byRegion(r);
 var h='<h2 style="margin:0 28px 2px 0;font-size:25px">'+r.c+' · '+esc(r.d)+'</h2><div class="sub" style="margin-bottom:10px">'+esc(r.tp)+' · '+esc(r.m)+(r.tc?' · '+esc(r.tc):'')+(r.cp?' · '+esc(r.cp):'')+'</div>'+
 '<div style="margin-bottom:12px">'+tag(r.k)+tecsOf(r,true).map(function(t){return '<span class="mini">'+esc(t)+'</span>'}).join('')+'</div>'+
 '<div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><b>'+N(r.t)+'</b><span>peças'+(r.rk?' · '+r.rk+'ª de '+R.filter(function(x){return x.t>0}).length:'')+'</span></div><div class="kpi"><b>'+BRL(r.val)+'</b><span>a preço de tabela (R$ '+N(r.p)+')</span></div>'+
 '<div class="kpi"><b>'+r.nr+'</b><span>representantes venderam</span></div><div class="kpi"><b>'+(r.d5?'+'+N(r.d5):'0')+'</b><span>peças desde 18/11</span></div></div>';
 h+='<h3 style="margin:14px 0 0;font-size:18px">Grade vendida por tamanho</h3><div class="note" style="margin-top:0">Total da coleção (o Sisplan não abre a grade por representante)'+(r.g?' · grade da ref.: '+r.g:'')+'</div>'+sizeChart(r.sz,r.ot,r.t);
 var rgk=REG.slice().sort(function(x,y){return (rg[y]||0)-(rg[x]||0)});
 h+='<h3 style="margin:16px 0 4px;font-size:18px">Por região</h3>'+rgk.map(function(g){var v=rg[g]||0;return '<div class="row2"'+(v?'':' style="color:var(--mu)"')+'><span style="width:120px">'+g+'</span><span style="flex:1">'+bar(v,r.t||1)+'</span><b>'+N(v)+'</b></div>'}).join('');
 var rk=Object.keys(RP).sort(function(a,b){return ((r.br[b]||0)-(r.br[a]||0))||(RP[a].n<RP[b].n?-1:1)});
 h+='<h3 style="margin:16px 0 4px;font-size:18px">Por representante</h3>'+rk.map(function(k){var v=r.br[k]||0;return '<div class="row2"'+(v?'':' style="color:var(--mu)"')+'><span style="width:170px">'+esc(RP[k].n)+'<span class="mini">'+RP[k].uf+'</span></span><span style="flex:1">'+bar(v,r.t||1)+'</span><b>'+N(v)+'</b></div>'}).join('');
 document.getElementById('drc').innerHTML=h;document.getElementById('dr').classList.add('on');}
function fechar(){document.getElementById('dr').classList.remove('on');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')fechar();});

// ---------- REGIÕES ----------
function vReg(){
 var tipos=uniq(function(r){return r.tp});var m={};REG.forEach(function(g){m[g]={};});
 var tg={};REG.forEach(function(g){tg[g]=0});
 R.forEach(function(r){var rg=byRegion(r);for(var g in rg){if(!m[g])continue;m[g][r.tp]=(m[g][r.tp]||0)+rg[g];tg[g]+=rg[g];}});
 var h='<div class="kpis">'+REG.map(function(g){var n=Object.keys(REPT).filter(function(k){return regOf(k)===g}).length,t=Object.keys(REPT).filter(function(k){return regOf(k)===g}).length;return '<div class="kpi" style="cursor:pointer;'+(S.regSel===g?'border-color:var(--ac)':'')+'" onclick="S.regSel=\''+g+'\';render()"><b>'+N(tg[g])+'</b><span>'+g+' · '+P(tg[g]/TOTAL,0)+' das peças · '+n+' reps</span></div>'}).join('')+'</div>';
 var g=S.regSel;var rows=R.map(function(r){return {r:r,q:(byRegion(r)[g]||0)}}).filter(function(x){return x.q>0}).sort(function(a,b){return b.q-a.q});
 var mxg=rows.length?rows[0].q:1;
 h+='<div class="card"><h2>'+g+': referências mais vendidas</h2><p class="d">Participação = quanto da venda total da referência veio desta região. Região mais forte que a média da coleção aparece em negrito azul.</p><table><tr><th>#</th><th>Ref.</th><th>Descrição</th><th class="n">Peças</th><th></th><th class="n">% da ref. vem daqui</th><th class="n">% da região</th></tr>'+
 rows.slice(0,25).map(function(x,i){var sh=x.q/x.r.t,base=tg[g]/TOTAL;return '<tr class="cl" onclick="abrir(\''+x.r.c+'\')"><td class="n">'+(i+1)+'</td><td><b>'+x.r.c+'</b></td><td>'+esc(x.r.d)+'<span class="mini">'+esc(x.r.m)+'</span></td><td class="n"><b>'+N(x.q)+'</b></td><td style="width:14%">'+bar(x.q,mxg)+'</td><td class="n '+(sh>base*1.4?'pos':'')+'">'+P(sh,0)+'</td><td class="n">'+P(x.q/tg[g])+'</td></tr>'}).join('')+'</table></div>';
 h+='<div class="card"><h2>Tipo de peça por região</h2><p class="d">Peças vendidas. Cor mais forte = maior parcela da região naquele tipo.</p><table class="hm"><tr><th>Tipo</th>'+REG.map(function(x){return '<th class="n">'+x+'</th>'}).join('')+'</tr>'+
 tipos.map(function(t){return '<tr><td>'+t+'</td>'+REG.map(function(x){var v=m[x][t]||0,s=tg[x]?v/tg[x]:0;return '<td class="v" style="background:rgba(195,214,238,'+Math.min(1,s*3)+')">'+(v?N(v)+'<br><small style="color:var(--mu)">'+P(s,0)+'</small>':'–')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>';
 return h;}

// ---------- REPRESENTANTES ----------
function vRep(){
 var ks=Object.keys(RP).map(function(k){return {k:k,t:REPT[k]||0}}).sort(function(a,b){return b.t-a.t});
 var mx=ks[0].t||1;
 var h='<div class="grid2"><div class="card"><h2>Representantes</h2><p class="d">Clique para ver as referências que cada um vende.</p><table><tr><th>Representante</th><th>Região</th><th class="n">Peças</th><th></th><th class="n">Refs vendidas</th></tr>'+
 ks.map(function(x){var n=0;R.forEach(function(r){if(r.br[x.k]>0)n++});return '<tr class="cl" onclick="S.repSel=\''+x.k+'\';render()" style="'+(S.repSel===x.k?'background:var(--pn2)':'')+(x.t?'':'color:var(--mu)')+'"><td>'+esc(RP[x.k].n)+'<span class="mini">'+RP[x.k].uf+'</span></td><td>'+RP[x.k].reg+'</td><td class="n"><b>'+N(x.t)+'</b></td><td style="width:16%">'+bar(x.t,mx)+'</td><td class="n">'+(n||'–')+'</td></tr>'}).join('')+'</table></div>';
 var k=S.repSel||ks[0].k;
 var rows=R.filter(function(r){return r.br[k]>0}).sort(function(a,b){return b.br[k]-a.br[k]});
 var tp={};rows.forEach(function(r){tp[r.tp]=(tp[r.tp]||0)+r.br[k]});var tt=REPT[k]||0;
 h+='<div><div class="card"><h2>'+esc(RP[k].n)+' · '+RP[k].r+'</h2><p class="d">'+N(tt)+' peças · '+rows.length+' referências · '+P(tt/TOTAL)+' da coleção</p>'+
 Object.keys(tp).sort(function(a,b){return tp[b]-tp[a]}).map(function(t){return '<div class="row2"><span style="width:130px">'+t+'</span><span style="flex:1">'+bar(tp[t],tt)+'</span><b>'+N(tp[t])+'</b><span style="width:46px;text-align:right;color:var(--mu)">'+P(tp[t]/tt,0)+'</span></div>'}).join('')+'</div>'+
 '<div class="card"><h2>Referências de '+esc(RP[k].n)+'</h2><table><tr><th>Ref.</th><th>Descrição</th><th class="n">Peças</th><th class="n">% da ref.</th></tr>'+rows.slice(0,30).map(function(r){return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td><b>'+r.c+'</b></td><td>'+esc(r.d)+'<span class="mini">'+esc(r.m)+'</span></td><td class="n"><b>'+N(r.br[k])+'</b></td><td class="n">'+P(r.br[k]/r.t,0)+'</td></tr>'}).join('')+'</table>'+(rows.length>30?'<p class="note">Mostrando as 30 maiores de '+rows.length+'.</p>':'')+'</div></div></div>';
 return h;}

// ---------- PRODUÇÃO ----------
function vProd(){
 var apostar=R.filter(function(r){return r.k==='A'&&r.nr>=4&&!(r.t>=30&&r.top>=.4)});
 var conc=R.filter(function(r){return r.k==='A'&&(r.nr<4||(r.t>=30&&r.top>=.4))});
 var calma=R.filter(function(r){return r.k==='C'}).sort(function(a,b){return a.t-b.t});
 var sem=R.filter(function(r){return r.k==='Z'});
 var lista=function(a,max){return '<table><tr><th>Ref.</th><th>Descrição</th><th class="n">Peças</th><th class="n">Reps</th><th class="n">Maior rep.</th></tr>'+a.slice(0,max).map(function(r){return '<tr class="cl" onclick="abrir(\''+r.c+'\')"><td><b>'+r.c+'</b></td><td>'+esc(r.d)+'<span class="mini">'+esc(r.m)+'</span></td><td class="n"><b>'+N(r.t)+'</b></td><td class="n">'+r.nr+'</td><td class="n">'+(r.t?P(r.top,0):'–')+'</td></tr>'}).join('')+'</table>'+(a.length>max?'<p class="note">Mostrando '+max+' de '+a.length+'. Veja todas em "Todas as referências" filtrando pela classe.</p>':'');};
 var h='<div class="card"><h2>Como ler</h2><p class="d" style="margin:0">Vendas são pedidos já tirados pelos representantes (não é estoque nem produção). A coleção ainda está aberta, então o ranking pode mudar: use como direção, não como sentença. Classe vem da curva ABC; "Apostar" exige venda em 4+ representantes e nenhum com 40% ou mais da referência.</p></div>';
 h+='<div class="grid2"><div class="card"><h2 style="color:var(--tx)">Apostar: lotes maiores</h2><p class="d">'+apostar.length+' referências classe A com demanda espalhada pela rede.</p>'+lista(apostar,20)+'</div>'+
 '<div class="card"><h2 style="color:var(--ac)">Classe A, mas concentrada</h2><p class="d">'+conc.length+' referências fortes, porém dependem de poucos representantes. Confirmar com a rede antes de aumentar lote.</p>'+lista(conc,20)+'</div></div>';
 h+='<div class="grid2"><div class="card"><h2 style="color:var(--wn)">Produzir com calma</h2><p class="d">'+calma.length+' referências classe C (venda baixa): risco de sobra se o lote for grande.</p>'+lista(calma,20)+'</div>'+
 '<div class="card"><h2 style="color:var(--mu)">Sem venda</h2><p class="d">'+sem.length+' referências sem pedido.</p>'+lista(sem,20)+'</div></div>';
 var tp=uniq(function(r){return r.tp}),allS=['30','32','34','36','38','40','42','44','46','48','50','52','54','PP','P','M','G','GG'];
 var cur={};R.forEach(function(r){var o=cur[r.tp]||(cur[r.tp]={t:0,s:{}});for(var k in r.sz){o.s[k]=(o.s[k]||0)+r.sz[k];o.t+=r.sz[k];}});
 var usados=allS.filter(function(k){return tp.some(function(t){return cur[t]&&cur[t].s[k]})});
 h+='<div class="card"><h2>Peças vendidas por tamanho, por tipo</h2><p class="d">Base para a grade de corte. Quantidade por numeração, somando os tamanhos que o relatório detalha. Quanto mais dourado, maior a parcela daquele tamanho dentro do tipo.</p><table class="hm"><tr><th>Tipo</th>'+usados.map(function(k){return '<th class="n">'+k+'</th>'}).join('')+'<th class="n">Peças</th></tr>'+
 tp.filter(function(t){return cur[t]}).map(function(t){var o=cur[t],mx=Math.max.apply(null,usados.map(function(k){return (o.s[k]||0)/o.t}));return '<tr><td>'+t+'</td>'+usados.map(function(k){var s=(o.s[k]||0)/o.t;return '<td class="v" style="background:rgba(195,214,238,'+(s/mx)+')">'+((o.s[k]||0)?N(o.s[k]):'–')+'</td>'}).join('')+'<td class="n">'+N(o.t)+'</td></tr>'}).join('')+'</table></div>';
 return h;}

// ---------- ESTILO ----------
function vEstilo(){
 var h='<div class="card"><h2>As apostas estão funcionando?</h2><p class="d">Cada tabela compara o rendimento médio por referência (peças por ref. lançada). Grupos com poucas referências têm leitura frágil: confira a coluna Refs.</p></div>';
 var sec=function(t,d,keyFn,min){return '<div class="card"><h2>'+t+'</h2><p class="d">'+d+'</p>'+tblGrupo(grupo(keyFn),'Grupo',min)+'</div>';};
 h+=sec('Por modelagem','Modelos com 3 ou mais referências.',function(r){return r.tp+' · '+r.m},3);
 h+=sec('Por tecnologia','Uma referência pode ter mais de uma tecnologia.',function(r){return r.tec.length?r.tec.filter(function(x){return x!=='Pack'}):null},1);
 h+=sec('Por tecido','Tecidos com 2 ou mais referências.',function(r){return r.tc},2);
 h+=sec('Características da referência','Importado, pack e grade estendida contra o restante do catálogo.',function(r){var a=[];a.push(r.im?'Importado':'Nacional');if(r.ex)a.push('Grade estendida');if(r.pk)a.push('Pack');return a},1);
 h+=sec('Por faixa de preço','Preço de tabela, sem as referências Pack. O grupo Pack aparece à parte.',function(r){if(r.pk)return 'Pack';return r.p<110?'Até R$ 109':r.p<130?'R$ 110 a 129':r.p<150?'R$ 130 a 149':r.p<170?'R$ 150 a 169':'R$ 170 ou mais'},1);
 return h;}

document.getElementById('topinfo').textContent=N(TOTAL)+' peças · '+R.length+' referências';
render();
</script>
